{% extends "base.html" %}
{% block title %}{{ 'Editar' if servico else 'Novo' }} Serviço — Agenda da Mãe{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{{ 'Editar Serviço' if servico else 'Novo Serviço' }}</h1>
    <a href="{{ url_for('servicos.listar') }}" class="btn">← Voltar</a>
</div>

<div class="card form-card">
    <form method="POST"
          action="{{ url_for('servicos.editar', id=servico.id) if servico else url_for('servicos.novo') }}"
          class="form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="nome">Nome *</label>
            <input type="text" id="nome" name="nome" required value="{{ servico.nome if servico else '' }}" minlength="2">
        </div>

        <div class="form-group">
            <label for="preco">Preço (R$) *</label>
            <input type="text" id="preco" name="preco" required
                   value="{{ '%.2f'|format(servico.preco|float) if servico else '' }}"
                   placeholder="40,00">
        </div>

        <div class="form-group">
            <label for="duracao_min">Duração (minutos) *</label>
            <input type="number" id="duracao_min" name="duracao_min" required min="15" step="15"
                   value="{{ servico.duracao_min if servico else 60 }}">
        </div>

        <div class="form-group">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" rows="3">{{ servico.descricao if servico else '' }}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="{{ url_for('servicos.listar') }}" class="btn">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
