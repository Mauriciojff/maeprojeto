{% extends "base.html" %}
{% block title %}Trocar Senha — Agenda da Mãe{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Trocar Senha</h1>
    <a href="{{ url_for('main.dashboard') }}" class="btn">← Voltar</a>
</div>

<div class="card form-card">
    <form method="POST" action="{{ url_for('auth.trocar_senha') }}" class="form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="senha_atual">Senha atual</label>
            <input type="password" id="senha_atual" name="senha_atual" required autocomplete="current-password">
        </div>

        <div class="form-group">
            <label for="nova_senha">Nova senha</label>
            <input type="password" id="nova_senha" name="nova_senha" required
                   autocomplete="new-password" minlength="8">
            <small class="form-help">Mínimo 8 caracteres, com maiúscula, minúscula e número.</small>
        </div>

        <div class="form-group">
            <label for="confirmar_senha">Confirmar nova senha</label>
            <input type="password" id="confirmar_senha" name="confirmar_senha" required
                   autocomplete="new-password" minlength="8">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Alterar senha</button>
        </div>
    </form>
</div>
{% endblock %}
