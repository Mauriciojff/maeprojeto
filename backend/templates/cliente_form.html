{% extends "base.html" %}
{% block title %}{{ 'Editar' if cliente else 'Novo' }} Cliente — Agenda da Mãe{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{{ 'Editar Cliente' if cliente else 'Novo Cliente' }}</h1>
    <a href="{{ url_for('clientes.listar') }}" class="btn">← Voltar</a>
</div>

<div class="card form-card">
    <form method="POST"
          action="{{ url_for('clientes.editar', id=cliente.id) if cliente else url_for('clientes.novo') }}"
          class="form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="nome">Nome *</label>
            <input type="text" id="nome" name="nome" required value="{{ cliente.nome if cliente else '' }}" minlength="2">
        </div>

        <div class="form-group">
            <label for="telefone">Telefone (WhatsApp)</label>
            <input type="text" id="telefone" name="telefone"
                   value="{{ cliente.telefone if cliente else '' }}"
                   placeholder="(00) 00000-0000"
                   pattern="[0-9\s\(\)\-\+]*">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ cliente.email if cliente else '' }}">
        </div>

        <div class="form-group">
            <label for="observacoes">Observações</label>
            <textarea id="observacoes" name="observacoes" rows="4">{{ cliente.observacoes if cliente else '' }}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="{{ url_for('clientes.listar') }}" class="btn">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
